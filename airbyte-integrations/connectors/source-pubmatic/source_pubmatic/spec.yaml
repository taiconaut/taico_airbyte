documentationUrl: https://docsurl.com
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: Pubmatic Spec
  type: object
  required:
    - publisher_id
    - email
    - password
    - frequency
  properties:
    publisher_id:
      title: Publisher ID
      type: string
    email:
      title: E-mail
      type: string
    frequency:
      title: Date Frequency
      type: string
      enum:
        - daily
        - monthly
      default: "monthly"
    password: 
      title: Password
      airbyte_secret: true

